[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh"
version = "0.1.0"
description = "Distributed inference across heterogeneous volunteer devices"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
]

[tool.setuptools]
packages = ["mesh"]
